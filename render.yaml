# Render Blueprint: one API service and three separately hosted front-ends.
# After the first deploy, copy each service's URL into the environment variables marked "set after first deploy".
services:
  - type: web
    name: care-companion-api
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node app/server.js
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # your key from console.anthropic.com
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5
      - key: ACCESS_CODE
        sync: false          # a passcode you share with people allowed to use the demo
      - key: PO_CODE
        sync: false          # optional: extra code to act as product owner
      - key: ENGINEER_CODE
        sync: false          # optional: extra code to act as engineer
      - key: CORS_ORIGINS
        sync: false          # optional: the three site URLs, comma separated (default allows any)
      - key: GITHUB_TOKEN
        sync: false          # optional: lets "Send to GitHub" create issues
      - key: GITHUB_REPO
        sync: false          # optional: yourname/care-companion-ai-sdlc

  - type: web
    name: care-companion-control-room
    runtime: static
    buildCommand: sh app/build-site.sh control-room
    staticPublishPath: app/web/control-room
    envVars:
      - key: API_URL
        sync: false          # set after first deploy: the API service URL
      - key: CONTROL_ROOM_URL
        sync: false
      - key: WORKSPACE_URL
        sync: false
      - key: PATIENT_URL
        sync: false

  - type: web
    name: care-companion-workspace
    runtime: static
    buildCommand: sh app/build-site.sh workspace
    staticPublishPath: app/web/workspace
    envVars:
      - key: API_URL
        sync: false
      - key: CONTROL_ROOM_URL
        sync: false
      - key: WORKSPACE_URL
        sync: false
      - key: PATIENT_URL
        sync: false

  - type: web
    name: care-companion-patient
    runtime: static
    buildCommand: sh app/build-site.sh patient
    staticPublishPath: app/web/patient
    envVars:
      - key: API_URL
        sync: false
      - key: CONTROL_ROOM_URL
        sync: false
      - key: WORKSPACE_URL
        sync: false
      - key: PATIENT_URL
        sync: false
