# Runs the code agent after a human merges an intent.md change to main.
# Needs: repository secret ANTHROPIC_API_KEY, and Settings > Actions > General >
# "Allow GitHub Actions to create and approve pull requests" ticked.
name: Code agent

on:
  push:
    branches: [main]
    paths: [intent.md]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Optional: build from the intent.md change since this commit (default: the last commit)"
        required: false

concurrency:
  group: code-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the code agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/code_agent.js
      - name: Ask the product owner when the agent has questions
        if: always() && steps.agent.outputs.result == 'questions'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Code agent needs answers before it can build" --body-file agent-questions.md
